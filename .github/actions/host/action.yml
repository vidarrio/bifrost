name: Host
description: >-
  What the end-to-end suites need of the runner: system packages, and
  bubblewrap allowed to create user namespaces (Ubuntu's AppArmor stops it by
  default).
inputs:
  packages:
    description: apt packages to install, space-separated.
    default: ""
runs:
  using: composite
  steps:
    - name: System packages
      if: inputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # Word splitting on purpose: one argument per package.
        # shellcheck disable=SC2086
        if dpkg-query -W $PACKAGES >/dev/null 2>&1; then
          echo "Already installed: $PACKAGES"
          exit 0
        fi
        # Ubuntu's archive only: what we install comes from there, and a
        # third-party source the runner image carries (Microsoft's has
        # answered 403) would fail apt-get update for nothing. If Ubuntu's
        # own sources aren't where we expect, stop rather than remove them.
        if [ ! -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          echo "::error::/etc/apt/sources.list.d/ubuntu.sources is missing; not touching apt sources"
          exit 1
        fi
        sudo find /etc/apt/sources.list.d -mindepth 1 -maxdepth 1 ! -name ubuntu.sources -exec rm -rf {} +
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y $PACKAGES
    - name: Let bubblewrap create user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
