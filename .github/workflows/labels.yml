name: Labels

# Labels each pull request with its kind of change, from the branch prefix.
# pull_request_target runs with the base branch's workflow and config and
# never checks out the pull request's code, so it can label PRs from forks.
on:
  pull_request_target:
    # A PR's branch can't change, so its label is decided when it opens; not
    # rerunning on pushes keeps a label someone removed on purpose removed.
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
