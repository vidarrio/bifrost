name: Release

# A pushed vX.Y.Z tag publishes the release: the container image to ghcr.io,
# the native bundle and its checksum on a GitHub release with the version's
# changelog notes, and build provenance for both (CONTRIBUTING.md, Releases).
# A pull request that changes this workflow runs it as a dry run: everything
# is built and the release assembled, nothing is published. (Job ids differ
# from ci.yml's so they can't stand in for its required checks.)
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release_notes.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # docker/build-push-action would upload a build record artifact every run.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  release-notes:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
      - name: Version and notes
        id: v
        env:
          DRY: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$DRY" = true ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            python3 .github/scripts/release_notes.py "$version" --dry-run > notes.md
          else
            version=${GITHUB_REF_NAME#v}
            python3 .github/scripts/release_notes.py "$version" > notes.md
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md

  release-image:
    # After the bundle and its signature: a failure there shouldn't leave a
    # published image without a release. (`sign` is skipped on pull requests.)
    needs: [release-notes, release-bundle, sign]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z and X.Y; latest only for non-prereleases.
          # latest is set explicitly below, so no automatic one.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release-notes.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release-notes.outputs.version }},enable=${{ needs.release-notes.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.release-notes.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Bifrost
            org.opencontainers.image.licenses=MIT
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
      - name: Attest the image's provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-bundle:
    needs: release-notes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/bundle/Containerfile
          target: bundle
          build-args: BIFROST_VERSION=${{ needs.release-notes.outputs.version }}
          outputs: type=local,dest=dist
          # The attestation below covers the file; no provenance.json beside it.
          provenance: false
          cache-from: type=gha,scope=bundle
      - name: Checksum
        working-directory: dist
        run: |
          ls -l
          sha256sum bifrost-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest the bundle's provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/bifrost-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/
          if-no-files-found: error

  # Signing runs apart from the build, in the `release` environment: only a
  # vX.Y.Z tag can deploy to it, so its secret is out of reach of workflows
  # on branches and pull requests.
  sign:
    if: github.event_name == 'push'
    needs: release-bundle
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/selfupdate.rs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist
      # `bifrost update` only takes a release whose SHA256SUMS verifies against
      # the public key in src/selfupdate.rs (RELEASE_KEY). The private key is
      # the RELEASE_SIGNING_KEY secret (PEM); a real release can't go out
      # without it, and the signature is checked against the compiled-in key.
      - name: Sign the checksums
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::the RELEASE_SIGNING_KEY secret isn't set"
            exit 1
          fi
          umask 077
          key=$(mktemp) pub=$(mktemp)
          trap 'rm -f "$key" "$pub"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS -out SHA256SUMS.sig
          test "$(stat -c %s SHA256SUMS.sig)" -eq 64
          want=$(sed -n 's/^const RELEASE_KEY: &str = "\([0-9a-f]\{64\}\)";$/\1/p' "$GITHUB_WORKSPACE/src/selfupdate.rs")
          if [ -z "$want" ]; then
            echo "::error::src/selfupdate.rs has no RELEASE_KEY"
            exit 1
          fi
          # SubjectPublicKeyInfo for an ed25519 key, then the raw key.
          python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.argv[1]))' \
            "302a300506032b6570032100$want" > "$pub"
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey "$pub" \
            -in SHA256SUMS -sigfile SHA256SUMS.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist/SHA256SUMS.sig
          if-no-files-found: error

  publish:
    needs: [release-notes, release-image, release-bundle, sign]
    # `sign` only runs for a tag; a pull request's dry run goes on without it.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-notes.outputs.version }}
          PRERELEASE: ${{ needs.release-notes.outputs.prerelease }}
        run: |
          {
            cat artifacts/notes/notes.md
            echo
            echo "## Install"
            echo
            echo "Container image: \`podman pull $IMAGE:$VERSION\` (see the [user guide](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/USER_GUIDE.md#installing))."
            echo
            echo "Native single file (Linux x86_64): \`bifrost-$VERSION-x86_64-linux\` below, with \`SHA256SUMS\` and its signature \`SHA256SUMS.sig\` (checked by \`bifrost update\`)."
            echo
            echo "Both carry build provenance: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`, or \`gh attestation verify oci://$IMAGE:$VERSION -R $GITHUB_REPOSITORY\`."
          } > notes.md
          files=(artifacts/bundle/bifrost-* artifacts/bundle/SHA256SUMS)
          if [ -e artifacts/signature/SHA256SUMS.sig ]; then
            files+=(artifacts/signature/SHA256SUMS.sig)
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::SHA256SUMS.sig is missing"
            exit 1
          fi
          ls -l "${files[@]}"
          cat notes.md
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "Dry run: would create release v$VERSION with the notes and files above."
            exit 0
          fi
          pre=(); [ "$PRERELEASE" = true ] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag "${pre[@]}" \
            --title "Bifrost $VERSION" --notes-file notes.md "${files[@]}"
