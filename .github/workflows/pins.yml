name: Pins

# Weekly: compare the release pins Dependabot can't watch (the bundle's Python,
# the Archipelago fork build) with the latest releases, and keep one issue
# open while any are behind (.github/scripts/check_pins.py).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare pins with the latest releases
        id: check
        run: python3 .github/scripts/check_pins.py "$RUNNER_TEMP/report.md" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.check.outputs.stale }}
        run: |
          title="Pinned releases are behind"
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
                  --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ "$STALE" = true ]; then
            if [ -n "$num" ]; then
              gh issue edit "$num" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label chore --body-file "$RUNNER_TEMP/report.md"
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" -R "$GITHUB_REPOSITORY" --comment "All pinned releases are current again."
          fi
