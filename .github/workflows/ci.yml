name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its old run. On main each run gets
# a group of its own, so every commit there is checked (and saves the cache).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # docker/build-push-action would upload a build record artifact every run.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  # Whether anything besides documentation changed; the slow jobs skip
  # otherwise (a skipped job counts as passed for the required checks).
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: End-to-end shards
        id: shards
        run: echo "shards=$(tests/e2e/run.sh shards)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main's caches can be restored by other branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Python helpers compile
        run: python3 -m py_compile scripts/*.py tests/e2e/*.py .github/scripts/*.py
      - name: Every end-to-end suite runs in CI
        run: |
          diff <(tests/e2e/run.sh list | sort) \
               <(ls tests/e2e/*.py | xargs -n1 basename | sed 's/\.py$//' | grep -vx lib | sort)
      - name: Rust base images and rust-version match the pinned toolchain
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          for f in Dockerfile packaging/bundle/Containerfile; do
            grep -q "^FROM docker.io/library/rust:${pin}-" "$f" \
              || { echo "::error file=$f::rust: base image doesn't match the toolchain pin ($pin)"; exit 1; }
          done
          grep -qx "rust-version = \"${pin%.*}\"" Cargo.toml \
            || { echo "::error file=Cargo.toml::rust-version should be ${pin%.*}, matching the toolchain pin ($pin)"; exit 1; }
      - name: Image and bundle pin the same Archipelago
        run: |
          pins() { grep -E '^ARG (AP_VERSION|AP_REPO)=' "$1"; }
          diff <(pins Dockerfile) <(pins packaging/bundle/Containerfile)

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main's caches can be restored by other branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests
        run: cargo test --workspace

  # The native end-to-end suites, in parallel shards: a debug build on the
  # runner, on the Archipelago build the image ships, under bubblewrap.
  e2e-suites:
    needs: changes
    # Runs for code changes, and also if `changes` itself failed (fail closed).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The shards are defined in tests/e2e/run.sh. If `changes` failed (and
        # this runs anyway, failing closed), fall back to three.
        shard: ${{ fromJSON(needs.changes.outputs.shards || '[1, 2, 3]') }}
    name: e2e (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      # The runner's own Python is newer than Archipelago supports (3.11–3.13);
      # 3.13 matches the image and the bundle.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Python packages
        run: python -m pip install -r tests/e2e/requirements.txt
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Let bubblewrap create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: cargo build
      # Keyed on what the install depends on (the venv links to the exact
      # Python patch release); restored and saved as separate steps so a
      # failing suite doesn't throw the install away.
      - name: Archipelago cache key
        id: apkey
        run: |
          v=$(tr -d '\r' < Dockerfile | sed -n 's/^ARG AP_VERSION=["]*\([^" ]*\).*/\1/p' | head -n1)
          echo "key=archipelago-$v-$(python3 -c 'import sys; print("py%d.%d.%d" % sys.version_info[:3])')-${{ hashFiles('scripts/bifrost_ap_install.py') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the Archipelago install
        id: apcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bifrost-dev/archipelago-bifrost
          key: ${{ steps.apkey.outputs.key }}
      - name: Install Archipelago
        run: tests/e2e/setup-ap.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save the Archipelago install
        if: steps.apcache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bifrost-dev/archipelago-bifrost
          key: ${{ steps.apkey.outputs.key }}
      - name: End-to-end suites
        run: tests/e2e/run.sh shard ${{ matrix.shard }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Logs of failed runs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: ~/.cache/bifrost-dev/run/*/bifrost.log
          if-no-files-found: ignore

  # One stable check for the ruleset, whatever the shards are.
  e2e:
    needs: [changes, e2e-suites]
    # always(), not !cancelled(): on a cancelled run this job must still run
    # and fail, since a skipped required check would count as passed.
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: All shards passed (or skipped for a docs-only change)
        run: |
          changes='${{ needs.changes.result }}'
          code='${{ needs.changes.outputs.code }}'
          suites='${{ needs.e2e-suites.result }}'
          echo "changes: $changes, code: $code, suites: $suites"
          [ "$suites" = success ] || { [ "$changes" = success ] && [ "$code" != true ] && [ "$suites" = skipped ]; }

  # The container image, built with a layer cache, then run under podman.
  image:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-requests
      - name: Let bubblewrap create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: localhost/bifrost:dev
          cache-from: type=gha,scope=image
          # Only main writes the cache; pull requests read main's.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=image' || '' }}
      - name: Hand the image to podman
        run: docker save localhost/bifrost:dev | podman load
      - name: Image suite
        run: tests/e2e/run.sh container
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The native single-file bundle, built with a layer cache, then run.
  bundle:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-requests
      - name: Let bubblewrap create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/bundle/Containerfile
          target: bundle
          build-args: BIFROST_VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=bundle
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=bundle' || '' }}
      - name: Bundle suite
        run: tests/e2e/run.sh bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
