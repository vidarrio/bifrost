name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its old run. On main each run gets
# a group of its own, so every commit there is checked (and saves the cache).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup update --no-self-update stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main's caches can be restored by other branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Python helpers compile
        run: python3 -m py_compile scripts/*.py tests/e2e/*.py
      - name: Image and bundle pin the same Archipelago
        run: |
          pins() { grep -E '^ARG (AP_VERSION|AP_REPO)=' "$1"; }
          diff <(pins Dockerfile) <(pins packaging/bundle/Containerfile)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main's caches can be restored by other branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests
        run: cargo test --workspace

  e2e:
    # The native end-to-end suites: a debug build on the runner, on the
    # Archipelago build the image ships, sandboxed with bubblewrap.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-venv python3-dev python3-requests
      - name: Let bubblewrap create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: cargo build
      # Keyed on what the install depends on; restored and saved as separate
      # steps so a failing suite doesn't throw the install away.
      - name: Archipelago cache key
        id: apkey
        run: |
          v=$(tr -d '\r' < Dockerfile | sed -n 's/^ARG AP_VERSION=["]*\([^" ]*\).*/\1/p' | head -n1)
          echo "key=archipelago-$v-$(python3 -c 'import sys; print("py%d.%d" % sys.version_info[:2])')-${{ hashFiles('scripts/bifrost_ap_install.py') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the Archipelago install
        id: apcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bifrost-dev/archipelago-bifrost
          key: ${{ steps.apkey.outputs.key }}
      - name: Install Archipelago
        run: tests/e2e/setup-ap.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save the Archipelago install
        if: steps.apcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bifrost-dev/archipelago-bifrost
          key: ${{ steps.apkey.outputs.key }}
      - name: End-to-end suites
        run: tests/e2e/run.sh native
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Logs of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ~/.cache/bifrost-dev/run/*/bifrost.log
          if-no-files-found: ignore

  packaging:
    # The container image and the native single-file bundle, built and run.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-requests
      - name: Let bubblewrap create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the image
        run: podman build -t bifrost:dev .
      - name: Build the bundle
        run: packaging/bundle/build.sh
      - name: Packaging suites
        run: tests/e2e/run.sh packaging
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Logs of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-logs
          path: ~/.cache/bifrost-dev/run/*/bifrost.log
          if-no-files-found: ignore
