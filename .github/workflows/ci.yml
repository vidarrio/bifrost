name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its old run. On main each run gets
# a group of its own, so every commit there is checked (and saves the cache).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup update --no-self-update stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main's caches can be restored by other branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Python helpers compile
        run: python3 -m py_compile scripts/*.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main's caches can be restored by other branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests
        run: cargo test --workspace
