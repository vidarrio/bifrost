[package]
name = "bifrost"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "Bifrost — the hub for all things Archipelago."
license = "MIT"
publish = false

# Workspace: the PopTracker-pack engine lives in its own crate (pure logic→state,
# no Bifrost/axum coupling). It is NOT yet a dependency of bifrost — it builds on
# its own via `cargo build -p poptracker` — so normal bifrost builds/deploys are
# unaffected until the feature is wired in.
[workspace]
members = ["crates/poptracker"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }   # form bodies + checker JSON
serde_json = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }  # AP tracker websocket (ws://)
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }  # Bifrost slots + claims
poptracker = { path = "crates/poptracker" }  # PopTracker-pack engine (runs pack Lua -> tracker state)
zip = { version = "9", default-features = false, features = ["deflate"] }  # read per-player files out of the generated seed zip + uploaded pack assets
argon2 = "0.5"  # native-account password hashing (argon2id)
sha2 = "0.10"  # session/link tokens are stored as SHA-256, never in the clear
libc = "0.2"  # sandbox floor: setrlimit / setsid / killpg for AP helper processes

# Planned, added as each phase lands:
#   reqwest     # the Discord bot / kanidm integration

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
