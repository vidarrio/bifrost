[package]
name = "bifrost"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
description = "Bifrost — the hub for all things Archipelago."
license = "MIT"
publish = false

# The PopTracker-pack engine is its own crate (pure logic → tracker state, no
# Bifrost or axum coupling); bifrost depends on it below.
[workspace]
members = ["crates/poptracker"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace", "set-header", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }   # form bodies + checker JSON
serde_json = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }  # AP tracker websocket (ws://)
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }  # Bifrost slots + claims
poptracker = { path = "crates/poptracker" }  # PopTracker-pack engine (runs pack Lua -> tracker state)
zip = { version = "9", default-features = false, features = ["deflate"] }  # read per-player files out of the generated seed zip + uploaded pack assets
argon2 = { version = "0.5", features = ["std"] }  # native-account password hashing (argon2id); std brings OsRng
sha2 = "0.11"  # session/link tokens are stored as SHA-256, never in the clear
libc = "0.2"  # sandbox floor: setrlimit / setsid / killpg for AP helper processes
toml = { version = "0.8", default-features = false, features = ["parse"] }  # $BIFROST_DATA/config.toml
tower = { version = "0.5", default-features = false }  # Layer: the season-URL rewrite wraps the router

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
