[package]
name = "bifrost"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Bifrost — the hub for all things Archipelago."
license = "MIT"
publish = false

# The PopTracker-pack engine is its own crate (pure logic → tracker state, no
# Bifrost or axum coupling); bifrost depends on it below.
[workspace]
members = ["crates/poptracker"]

[features]
# A build for a public demo: passwordless role switching, with what that
# would make dangerous turned off (src/demo.rs). Never in a release.
demo = []

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace", "set-header", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }   # form bodies + checker JSON
serde_json = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }  # AP tracker websocket (ws://)
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Not plain "sqlite": that also builds in extension loading and deserialize, which Bifrost doesn't use.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "sqlite-unlock-notify", "macros"] }  # Bifrost slots + claims
poptracker = { path = "crates/poptracker" }  # PopTracker-pack engine (runs pack Lua -> tracker state)
zip = { version = "9", default-features = false, features = ["deflate"] }  # read per-player files out of the generated seed zip + uploaded pack assets
# std enables rand_core/getrandom, which `argon2::password_hash::rand_core::OsRng`
# (src/auth.rs) needs; tokio-tungstenite 0.24 used to enable it through rand 0.8.
argon2 = { version = "0.5", features = ["std"] }  # native-account password hashing (argon2id)
sha2 = "0.11"  # session/link tokens are stored as SHA-256, never in the clear
libc = "0.2"  # sandbox floor: setrlimit / setsid / killpg for AP helper processes
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }  # $BIFROST_DATA/config.toml, common games' game.toml
tower = { version = "0.5", default-features = false }  # Layer: the season-URL rewrite wraps the router
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }  # verifies signed release checksums (bifrost update)
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }  # common-game join guides (Markdown) on the game page
regex = { version = "1", default-features = false, features = ["std", "unicode"] }  # a common game's rule for its players' names

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
