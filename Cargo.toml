[package]
name = "bifrost"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "Bifrost — the hub for all things Archipelago."
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Planned, added as each phase lands:
#   sqlx        = { version = "0.8", features = ["runtime-tokio","sqlite","time","migrate"] }  # hint tags, notes, season state
#   serde/toml                                                                                  # config + AP protocol messages
#   tokio-tungstenite                                                                           # AP MultiServer websocket client (live board)
#   reqwest                                                                                     # the Discord bot / kanidm integration

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
